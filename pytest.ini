[pytest]
# Default options for running the test suite.
#
# * ``-q`` – quiet output; this keeps CI logs readable.
# * ``--maxfail=0`` – allow all tests to run even if failures occur.
#
# In addition, we configure the environment for tests that may involve
# network calls.  The repository is configured to run tests on
# macOS, where the optional ``ollama`` LLM backend may not be
# available.  Tests that require the LLM are expected to be marked with
# the ``@pytest.mark.llm`` decorator.  The ``addopts`` line below does
# not enforce skipping – it merely ensures that the marker is
# recognised when the tests are executed with ``pytest``.
addopts = -q
markers =
    llm: mark test as requiring an LLM backend